name: validate-distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recovery gate must reject hidden failures
        run: python scripts/robustness/test_gate_policy.py
      - name: Repeated production recovery gate
        run: python scripts/verify_robustness.py --repetitions 3
      - name: Validate shell and app metadata
        run: |
          bash -n scripts/migrate_local_to_repo.sh
          bash -n scripts/recover_missing_local_source.sh
          bash -n scripts/upgrade_local_app.sh
          python scripts/validate_versions.py
          python scripts/verify_documentation.py
          grep -Fxq 'slug: energy_coordinator' energy_coordinator/config.yaml
          test -f repository.yaml
          bash scripts/test_local_source_paths.sh
      - name: Packaged shadow replay contract
        run: python scripts/verify_packaged_shadow.py
      - name: Unit tests
        run: |
          cd energy_coordinator
          python -m unittest discover -s tests -q
      - name: Shadow companion regression tests
        run: |
          cd priority_shadow
          python -m unittest discover -s tests -q
          JOURNAL_PROJECTION_FIXTURE=/tmp/synthetic-journal-0625.json python -m unittest discover -s tests -p test_monitor_sqlite_0625.py -q
          JOURNAL_PROJECTION_FIXTURE=/tmp/synthetic-journal-0625.json node ../scripts/test_journal_transport.mjs
          node --check dashboard/night-priority-card.js
          node ../scripts/test_partial_card.mjs
          node ../scripts/test_same_day_reconstruction.mjs
          node ../scripts/test_card_updates.mjs
          node ../scripts/test_deep_fixes_0613.mjs
          node ../scripts/test_independent_fixes_0614.mjs
          node ../scripts/test_audit_fixes_0616.mjs
  recovery-python314:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Recovery gate must reject hidden failures
        run: python scripts/robustness/test_gate_policy.py
      - name: Repeated production recovery gate
        run: python scripts/verify_robustness.py --repetitions 3
