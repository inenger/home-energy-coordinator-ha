# HEC LIVE v1. Active HA package, not shadow. 02:59:40–05:00 Prague.
# Never modify inverter working mode, force charge, breaker setting or EEPROM power registers.
# All physical writes use HA-number services with compare-and-swap restoration.
input_boolean:
  hec_live_owned:
    name: HEC LIVE · převzaté fyzické limity
    icon: mdi:shield-lock
input_number:
  hec_live_reserve_before:
    name: HEC LIVE · původní rezerva SOC
    min: 15
    max: 100
    step: 1
    mode: box
  hec_live_ev_before:
    name: HEC LIVE · původní proud EV
    min: 6
    max: 16
    step: 1
    mode: box
  hec_live_reserve_target:
    name: HEC LIVE · poslední rezervní SOC
    min: 15
    max: 100
    step: 1
    mode: box
  hec_live_ev_target:
    name: HEC LIVE · poslední proud EV
    min: 6
    max: 16
    step: 1
    mode: box

template:
  - sensor:
      - name: HEC LIVE · skutečné řízení
        unique_id: hec_live_physical_controller_v1
        icon: mdi:shield-home
        state: "{{ 'active' if is_state('input_boolean.hec_live_owned','on') else 'idle' }}"
        attributes:
          physical_control_configured: true
          controlled: battery_backup_min_soc_and_ev_max_current
          reserve_soc: "{{ states('number.solax_backup_discharge_min_soc') }}"
          reserve_target: "{{ states('input_number.hec_live_reserve_target') }}"
          ev_limit_a: "{{ states('number.solax_api_max_charge_current_setting') }}"
          ev_target_a: "{{ states('input_number.hec_live_ev_target') }}"

automation:
  - id: hec_live_claim_20261113
    alias: HEC LIVE · převzetí nočních limitů
    triggers:
      - trigger: time
        at: "02:59:40"
      - trigger: time_pattern
        minutes: "/1"
        seconds: "0"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ (now().hour == 2 and now().minute == 59 and now().second >= 35) or (3 <= now().hour < 5) }}"
      - condition: state
        entity_id: input_boolean.hec_live_owned
        state: "off"
      - condition: state
        entity_id: select.solax_charger_use_mode
        state: Back Up Mode
      - condition: template
        value_template: >-
          {{ is_number(states('number.solax_backup_discharge_min_soc'))
             and 15 <= states('number.solax_backup_discharge_min_soc')|float <= 100
             and is_number(states('number.solax_api_max_charge_current_setting'))
             and 6 <= states('number.solax_api_max_charge_current_setting')|float <= 16
             and is_number(states('sensor.solax_battery_capacity'))
             and is_number(states('sensor.solax_api_charge_power_total'))
             and states('sensor.solax_api_charge_power_total')|float < 100
             and is_state('input_boolean.battery_charge','off')
             and is_state('input_boolean.baterie_nabijeni_levny_proud_aktivni','off')
             and states('number.solax_main_breaker_current_limit')|int(0) == 25 }}
    actions:
      - variables:
          old_soc: "{{ states('number.solax_backup_discharge_min_soc')|int }}"
          old_ev: "{{ states('number.solax_api_max_charge_current_setting')|int }}"
          pv_kwh: >-
            {% set s = states.sensor.solcast_pv_forecast_forecast_today %}
            {% if s is not none and is_number(s.state)
                and 0 <= as_timestamp(now()) - as_timestamp(s.last_updated) < 108000 %}
              {{ s.state|float }}
            {% else %}-1{% endif %}
      - variables:
          wanted_soc: >-
            {% set pv = pv_kwh|float(-1) %}
            {% if pv <= 15 %}100
            {% elif pv >= 50 %}25
            {% else %}{{ (100 - (pv - 15) * 75 / 35)|round(0,'ceil')|int }}
            {% endif %}
          wanted_ev: "{{ [old_ev|int,12]|min }}"
      - action: input_number.set_value
        target: {entity_id: input_number.hec_live_reserve_before}
        data: {value: "{{ old_soc }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.hec_live_ev_before}
        data: {value: "{{ old_ev }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.hec_live_reserve_target}
        data: {value: "{{ wanted_soc|int }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.hec_live_ev_target}
        data: {value: "{{ wanted_ev|int }}"}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.hec_live_owned}
      - action: number.set_value
        target: {entity_id: number.solax_api_max_charge_current_setting}
        data: {value: "{{ wanted_ev|int }}"}
      - delay: "00:00:03"
      - action: number.set_value
        target: {entity_id: number.solax_backup_discharge_min_soc}
        data: {value: "{{ wanted_soc|int }}"}
      - delay: "00:00:05"
      - if:
          - condition: template
            value_template: >-
              {{ states('number.solax_backup_discharge_min_soc')|int(-1) != wanted_soc|int
                  or states('number.solax_api_max_charge_current_setting')|int(-1) != wanted_ev|int }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: hec_live_readback
              title: HEC LIVE · povel bez potvrzené odezvy
              message: >-
                Ověřte SolaX. Rezerva aktuálně {{ states('number.solax_backup_discharge_min_soc') }}
                vs {{ wanted_soc }}; wallbox {{ states('number.solax_api_max_charge_current_setting') }}
                vs {{ wanted_ev }} A. Cizí zásahy koordinátor nepřepisuje.
    mode: single

  - id: hec_live_phase_limit_20261113
    alias: HEC LIVE · fázový regulátor wallboxu
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: template
        value_template: "{{ 3 <= now().hour < 5 }}"
      - condition: state
        entity_id: input_boolean.hec_live_owned
        state: "on"
      - condition: state
        entity_id: select.solax_charger_use_mode
        state: Back Up Mode
      - condition: template
        value_template: >-
          {{ states('number.solax_backup_discharge_min_soc')|int(-1)
                 == states('input_number.hec_live_reserve_target')|int(-2)
             and states('number.solax_api_max_charge_current_setting')|int(-1)
                 == states('input_number.hec_live_ev_target')|int(-2)
             and is_state('input_boolean.battery_charge','off')
             and is_state('input_boolean.baterie_nabijeni_levny_proud_aktivni','off')
             and states('sensor.solax_api_charge_power_total')|float(0) > 250 }}
    actions:
      - variables:
          ev_now: "{{ states('number.solax_api_max_charge_current_setting')|int }}"
          ev_orig: "{{ states('input_number.hec_live_ev_before')|int }}"
          phase_max: >-
            {% set ids = [
               'sensor.solax_inverter_solax_grid_current_l1',
               'sensor.solax_inverter_solax_grid_current_l2',
               'sensor.solax_inverter_solax_grid_current_l3'] %}
            {% set ns = namespace(valid=true, maximum=0) %}
            {% for e in ids %}
              {% set s = states[e] %}
              {% if s is none or not is_number(s.state)
                    or as_timestamp(now()) - as_timestamp(s.last_updated) > 65 %}
                {% set ns.valid = false %}
              {% else %}
                {% set v = s.state|float %}
                {% if not 0 <= v < 100 %}{% set ns.valid = false %}{% endif %}
                {% set ns.maximum = [ns.maximum,v]|max %}
              {% endif %}
            {% endfor %}
            {{ ns.maximum if ns.valid else -1 }}
      - variables:
          ev_next: >-
            {% set a = ev_now|int %}
            {% set i = phase_max|float(-1) %}
            {% if i < 0 %}{{ [6,a]|min }}
            {% elif i >= 22 %}{{ [6,a-((i-20)|round(0,'ceil')|int)]|max }}
            {% elif i < 17 and a < ev_orig|int %}{{ [16,ev_orig|int,a+1]|min }}
            {% else %}{{ a }}{% endif %}
      - if:
          - condition: template
            value_template: "{{ ev_next|int != ev_now|int }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.hec_live_ev_target}
            data: {value: "{{ ev_next|int }}"}
          - action: number.set_value
            target: {entity_id: number.solax_api_max_charge_current_setting}
            data: {value: "{{ ev_next|int }}"}
      - if:
          - condition: template
            value_template: "{{ phase_max|float(-1) >= 24.5 }}"
        then:
          - action: select.select_option
            target: {entity_id: select.solax_api_charger_use_mode}
            data: {option: Stop}
          - action: persistent_notification.create
            data:
              notification_id: hec_live_ev_emergency_stop
              title: HEC LIVE · nouzové zastavení wallboxu
              message: >-
                Naměřen proud alespoň 24,5 A na některé fázi.
                Nabíječka byla nastavena na Stop; pro nové nabíjení
                je nutné znovu zvolit režim.
      - if:
          - condition: template
            value_template: "{{ phase_max|float(-1) >= 24 and ev_now|int <= 6 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: hec_live_grid_high
              title: HEC LIVE · fázová rezerva pod limitem
              message: "Proud fáze >=24 A při minimálním limitu EV 6 A. Zkontrolujte další zátěže."
    mode: single

  - id: hec_live_restore_20261113
    alias: HEC LIVE · nezávislá obnova limitů po 05:00
    triggers:
      - trigger: time
        at: "05:00:00"
      - trigger: time_pattern
        minutes: "/1"
        seconds: "0"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hec_live_owned
        state: "on"
      - condition: template
        value_template: "{{ not ((now().hour == 2 and now().minute == 59 and now().second >= 35) or 3 <= now().hour < 5) }}"
    actions:
      - variables:
          old_soc: "{{ states('input_number.hec_live_reserve_before')|int(-3) }}"
          last_soc: "{{ states('input_number.hec_live_reserve_target')|int(-2) }}"
          old_ev: "{{ states('input_number.hec_live_ev_before')|int(-3) }}"
          last_ev: "{{ states('input_number.hec_live_ev_target')|int(-2) }}"
      - if:
          - condition: template
            value_template: >-
              {{ states('number.solax_backup_discharge_min_soc')|int(-1) == last_soc|int
                 and last_soc|int != old_soc|int }}
        then:
          - action: number.set_value
            target: {entity_id: number.solax_backup_discharge_min_soc}
            data: {value: "{{ old_soc|int }}"}
      - if:
          - condition: template
            value_template: >-
              {{ states('number.solax_api_max_charge_current_setting')|int(-1) == last_ev|int
                 and last_ev|int != old_ev|int }}
        then:
          - action: number.set_value
            target: {entity_id: number.solax_api_max_charge_current_setting}
            data: {value: "{{ old_ev|int }}"}
      - delay: "00:00:05"
      - variables:
          now_soc: "{{ states('number.solax_backup_discharge_min_soc')|int(-1) }}"
          now_ev: "{{ states('number.solax_api_max_charge_current_setting')|int(-1) }}"
      - if:
          - condition: template
            value_template: >-
              {{ (now_soc|int == old_soc|int or
                  (now_soc|int != last_soc|int and now_soc|int >= 15))
                 and (now_ev|int == old_ev|int or
                  (now_ev|int != last_ev|int and now_ev|int >= 6)) }}
        then:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.hec_live_owned}
          - if:
              - condition: template
                value_template: "{{ now_soc|int != old_soc|int or now_ev|int != old_ev|int }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: hec_live_override
                  title: HEC LIVE · změna jiným vlastníkem
                  message: >-
                    Po 05:00 ponecháno externí nastavení:
                    rezerva {{ now_soc }} %, wallbox {{ now_ev }} A.
    mode: single
